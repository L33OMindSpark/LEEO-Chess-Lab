<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEEO Chess Lab</title>
<meta name="description" content="Analyse every game from a chess.com account with Stockfish: your level, playstyle, openings, habits and whether you are improving.">
<meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0B131B" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
</head>
<body>
<header class="top" id="top">
  <a class="brand" href="#/"><i class="mark"></i><b>LEEO</b><span>Chess Lab</span></a>
  <nav id="nav"></nav>
  <div class="tright"><form id="uform" autocomplete="off"><input id="uname" placeholder="Switch to username" aria-label="chess.com username" spellcheck="false"><button class="btn primary small pill">Analyse</button></form><span id="tcta"></span><button class="burger" id="burger" aria-label="Menu"><i></i></button></div>

<main id="app"></main>
<div id="job" hidden></div>
<script type="module" src="/src/main.js"></script>
